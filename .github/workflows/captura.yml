name: Captura de datos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"   # cada lunes a las 12:00 UTC

permissions:
  contents: write

jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Capturar precios SNIIM (últimos 14 días)
        run: python src/sniim_captura.py --ultimos-dias 14

      - name: Capturar producción SIAP (solo años nuevos)
        run: python src/siap_captura.py

      - name: Guardar datos nuevos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bronce
          git diff --cached --quiet || git commit -m "Captura automática $(date -u +%F)"
          git push